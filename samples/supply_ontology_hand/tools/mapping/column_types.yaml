    usage_denominator: {type: DECIMAL, precision: 18, scale: 6}
    standard_usage: {type: DECIMAL, precision: 18, scale: 6}
    variable_loss_rate: {type: DECIMAL, precision: 18, scale: 6}
    demand_quantity: {type: DECIMAL, precision: 18, scale: 6}
  erp_mds_forecast:
    id: {type: VARCHAR, length: 64}
    billno: {type: VARCHAR, length: 64}
    material_number: {type: VARCHAR, length: 64}
    qty: {type: DECIMAL, precision: 18, scale: 6}
  erp_mrp_plan_order:
