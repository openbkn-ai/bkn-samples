# Business semantics take precedence over sample-value inference.
# Lengths are deliberately generous for the demo and can be tightened when
# the source-system contract supplies exact limits.
overrides:
  customer_entity:
    contact_phone: {type: VARCHAR, length: 32}
    customer_code: {type: VARCHAR, length: 64}
  erp_material:
    material_code: {type: VARCHAR, length: 64}
    material_standard_price: {type: DECIMAL, precision: 18, scale: 6}
  erp_material_bom:
    material_code: {type: VARCHAR, length: 64}
    bom_material_code: {type: VARCHAR, length: 64}
    parent_material_code: {type: VARCHAR, length: 64}
