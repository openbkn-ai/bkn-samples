    qty: {type: DECIMAL, precision: 18, scale: 6}
    xkquainwaqty: {type: DECIMAL, precision: 18, scale: 6}
  erp_purchase_order:
    billno: {type: VARCHAR, length: 64}
    supplier_number: {type: VARCHAR, length: 64}
    material_number: {type: VARCHAR, length: 64}
    srcbillnumber: {type: VARCHAR, length: 64}
    tax_price: {type: DECIMAL, precision: 18, scale: 6}
    qty: {type: DECIMAL, precision: 18, scale: 6}
    taxrate: {type: DECIMAL, precision: 18, scale: 6}
    invqty: {type: DECIMAL, precision: 18, scale: 6}
