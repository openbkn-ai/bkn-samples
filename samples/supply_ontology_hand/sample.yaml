apiVersion: samples.openbkn.ai/v1alpha1
kind: Sample
metadata:
  language: zh-CN
  name: supply-chain
  aliases: []
  displayName: 供应链
  summary: 用脱敏的订单、库存、BOM 和采购数据体验欠货补发、接单承诺和采购跟进。
spec:
  studio:
    licenseNote: 脱敏历史回放，不能用于真实交付承诺。
    questions:
      - 客户想再订 30 套 526-000006，现在最多能接多少套？
      - 哪些产品的欠货靠现货和现有库存都补不上？
    experienceSet: experience/experience-set.yaml
  database:
    engine: mariadb
    name: supply_demo_hand
    expectedTables: 12
  data:
    mode: embedded
  knowledgeNetwork:
    id: supply_ontology_hand
    displayName: 供应链本体知识网络-手工版
  capabilities:
    required: true
  components:
    objects: true
    relations: true
    metrics: false
    functions: true
    skills: true
  hooks:
    dbInit: db/init.sh
    dbVerify: db/verify.sh
    platformInstall: platform/install.sh
    platformVerify: platform/verify.sh
