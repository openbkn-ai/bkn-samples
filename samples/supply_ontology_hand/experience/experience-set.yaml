apiVersion: samples.openbkn.ai/v1alpha1
kind: ExperienceSet
metadata:
  language: zh-CN
  source:
    answerSet: bkn-eval/baselines/2026-10-30-business-scenarios-v4/answer-set-v4.yaml
    setId: supply-business-scenarios-v4
spec:
  businessDate: '2026-08-25'
  cases:
  - id: Q-05
    title: 欠客户多少货
    explanation: 从销售订单的签约和发货数量算出还没发完的订单和欠交套数。
    question: 现在还有多少张销售订单没发完货？一共还欠客户多少套？
    answer: 还有 192 张销售订单没发完货，一共欠客户 470 套。
    expected:
      orders: 192
      unshipped_qty: 470
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (s:supply_ontology_hand_salesorder)
        WHERE s.signing_quantity > s.shipping_quantity
        RETURN count(*) AS orders, sum(s.signing_quantity - s.shipping_quantity) AS unshipped_qty
  - id: Q-04
    title: 成品仓可发货
    explanation: 沿「产品关联库存」找到库存，只算三个成品仓里状态为可用的数量。
    question: 382-000005 北斗导航农机驾驶仪在三个成品仓里还有多少可用库存？
    answer: 382-000005 在苏州、乌鲁木齐、哈尔滨三个成品仓共有 534 套可用库存。
    expected:
      qty: 534
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (p:supply_ontology_hand_product {material_number: '382-000005'})-[:supply_ontology_hand_prod2inv]->(i:supply_ontology_hand_inventory)
        WHERE i.warehouse IN ['苏州成品仓', '乌鲁木齐成品仓', '哈尔滨成品仓'] AND i.stock_status = '可用'
        RETURN sum(i.available_inventory_qty) AS qty
      graph: |-
        MATCH (p:supply_ontology_hand_product {material_number: '382-000005'})-[:supply_ontology_hand_prod2inv]->(i:supply_ontology_hand_inventory)
        WHERE i.warehouse IN ['苏州成品仓', '乌鲁木齐成品仓', '哈尔滨成品仓'] AND i.stock_status = '可用'
  - id: Q-06
    title: 未关闭的预测
    explanation: 统计关闭状态不是已关闭的需求预测，看还有多少预测压力。
    question: 手上还挂着多少张没关闭的需求预测？合计多少套？
    answer: 还挂着 90 张没关闭的需求预测，合计 56340 套。
    expected:
      count: 90
      qty: 56340
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (f:supply_ontology_hand_forecast)
        WHERE f.closestatus_title <> '已关闭'
        RETURN count(*) AS count, sum(f.qty) AS qty
  - id: Q-09
    title: 拖得最久的欠单
    explanation: 比较欠单的承诺交期和业务日期 2026-08-25，找出逾期最久的一张。
    question: 欠货的订单里有多少张已经过了承诺交期？拖得最久的是哪张单，拖了多少天？
    answer: 192 张欠单全部已过承诺交期；拖得最久的是 SO0000538，承诺 2026-03-16 交货，已经逾期 162 天。
    expected:
      overdue_orders: 192
      oldest_order: SO0000538
      days_late: 162
    surfaces:
    - agent
  - id: Q-14
    title: 一颗料用在哪些成品
    explanation: 从物料反查各产品 BOM 的主料行，得到受它影响的成品。
    question: 密封圈 165-002537 用在哪些成品上？
    answer: 密封圈 165-002537 用在 5 个成品上：367-000061、367-000097、367-000102、367-000130、367-000131。
    expected:
      product_codes:
      - 367-000061
      - 367-000097
      - 367-000102
      - 367-000130
      - 367-000131
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (b:supply_ontology_hand_bom)-[:supply_ontology_hand_bom2mat]->(m:supply_ontology_hand_material {material_code: '165-002537'})
        WHERE b.alt_priority = 0 AND b.bom_level > 0
        RETURN DISTINCT b.bom_material_code AS product_codes
      graph: |-
        MATCH (p:supply_ontology_hand_product)-[:supply_ontology_hand_prod2bom]->(b:supply_ontology_hand_bom)-[:supply_ontology_hand_bom2mat]->(m:supply_ontology_hand_material {material_code: '165-002537'})
        WHERE b.alt_priority = 0 AND b.bom_level > 0
  - id: Q-11
    title: 逾期没到的采购
    explanation: 未关闭、未终止且没收完的采购行里，交期早于业务日期的就是逾期在途。
    question: 已经过了交期还没到齐的采购行有多少？涉及多少家供应商？
    answer: 有 483 条采购行已经过了交期还没到齐，涉及 133 家供应商。
    expected:
      lines: 483
      suppliers: 133
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (po:supply_ontology_hand_po)
        WHERE po.rowclosestatus_title = '正常' AND po.rowterminatestatus_title = '正常' AND po.qty - po.actqty > 0 AND po.deliverdate < '2026-08-25'
        RETURN count(*) AS lines, count(DISTINCT po.supplier_number) AS suppliers
  - id: Q-12
    title: 先催哪家供应商
    explanation: 按供应商汇总逾期在途的行数和未到数量，找出最该催的一家。
    question: 逾期没到货的采购行最多的是哪家供应商？共多少行、还欠我们多少数量？
    answer: 逾期最多的是俅门信和达电子有限公司：50 行没到，还欠 2844000 个。
    expected:
      supplier: 俅门信和达电子有限公司
      lines: 50
      open_qty: 2844000
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (po:supply_ontology_hand_po)
        WHERE po.rowclosestatus_title = '正常' AND po.rowterminatestatus_title = '正常' AND po.qty - po.actqty > 0 AND po.deliverdate < '2026-08-25'
        RETURN po.supplier_name AS supplier, count(*) AS lines, sum(po.qty - po.actqty) AS open_qty
        ORDER BY lines DESC
        LIMIT 1
  - id: Q-20
    title: 今天下单哪天到
    explanation: 物料的标准采购提前期从业务日期起算，就是最早到货日。
    question: 贴片无源晶振 527-000017 今天下单的话，最早哪天能到？
    answer: 贴片无源晶振 527-000017 采购提前期 70 天，今天（2026-08-25）下单最早 2026-11-03 到货。
    expected:
      arrival_date: '2026-11-03'
    surfaces:
    - agent
  - id: Q-35
    title: 这批料为谁备的
    explanation: 沿采购订单行 → 请购单行 → MRP 计划订单 → 需求预测，一路追到源头。
    question: 采购订单 02-KSHA-CGDD-260402-012958 里 849-000904 这一行是从哪张请购单来的？请购又是哪张 MRP 计划订单生成的？最终是为哪张需求预测、哪个产品备的料？
    answer: 这一行来自请购单 CGSQ-260331-000026，请购由 MRP 计划订单 JHJY-20260331-00045866 生成，最终为需求预测 YCD2026020500000045 中的产品 P69-000060 备料。
    expected:
      purchase_request: CGSQ-260331-000026
      mrp_plan_order: JHJY-20260331-00045866
      forecast: YCD2026020500000045
      product_codes:
      - P69-000060
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (po:supply_ontology_hand_po {billno: '02-KSHA-CGDD-260402-012958', material_number: '849-000904'})-[:supply_ontology_hand_pr2po]->(pr:supply_ontology_hand_pr)-[:supply_ontology_hand_pr2mrp]->(m:supply_ontology_hand_mrp)-[:supply_ontology_hand_mrp2fcst]->(f:supply_ontology_hand_forecast)
        RETURN DISTINCT pr.billno AS purchase_request, m.billno AS mrp_plan_order, f.billno AS forecast, f.material_number AS product_codes
      graph: 'MATCH (po:supply_ontology_hand_po {billno: ''02-KSHA-CGDD-260402-012958'', material_number: ''849-000904''})-[:supply_ontology_hand_pr2po]->(pr:supply_ontology_hand_pr)-[:supply_ontology_hand_pr2mrp]->(m:supply_ontology_hand_mrp)-[:supply_ontology_hand_mrp2fcst]->(f:supply_ontology_hand_forecast)'
  - id: Q-23
    title: 现货不够补欠货
    explanation: 把每个产品的欠交套数和全公司成品可用库存相比，找出现货补不上的产品。
    question: 哪些产品的欠货已经超过了成品现货？各差多少套？
    answer: 8 个产品的欠货超过成品现货：367-000097 差 4 套、367-000102 差 9 套、367-000130 差 21 套、367-000131 差 15 套、526-000006 差 3 套、590-000100 差 18 套、734-000001 差 1 套、P61-000351 差 12 套。
    expected:
      products:
        367-000097: 4
        367-000102: 9
        367-000130: 21
        367-000131: 15
        526-000006: 3
        590-000100: 18
        734-000001: 1
        P61-000351: 12
    surfaces:
    - agent
  - id: Q-24
    title: 生产也补不上的欠货
    explanation: 现货不够的部分再按 BOM 逐层净扣看现有库存能做多少，仍不够的就是真缺口。
    question: 现货补完欠货后还不够的产品里，哪些靠现有库存也生产不出来？还差多少套？
    answer: 5 个产品靠现货和现有库存都补不上：367-000097 还差 4 套、367-000102 差 9 套、367-000130 差 21 套、367-000131 差 15 套、734-000001 差 1 套。
    expected:
      products:
        367-000097: 4
        367-000102: 9
        367-000130: 21
        367-000131: 15
        734-000001: 1
    surfaces:
    - agent
  - id: Q-27
    title: 欠单先补谁
    explanation: 欠单按承诺交期先后用现货补发，补不上的再看能否用库存生产。
    question: 526-000006 的欠单按承诺交期先后用现货补发，哪几张单补不上？差的部分能不能用现有库存生产出来？
    answer: 526-000006 现货 30 套按交期补发后，SO0000592 和 SO0000096 补不上，还差 3 套；现有库存还能做 11 套，可以生产补足。
    expected:
      unmet_orders:
      - SO0000592
      - SO0000096
      remaining_qty: 3
      can_build: true
    surfaces:
    - agent
  - id: Q-28
    title: 还能接多少新单
    explanation: 可承诺量 = 成品库存 + 现有库存可做数量 − 已签约欠货，要先保住欠单。
    question: 客户想再订 30 套 526-000006，现在最多能接多少套？
    answer: 最多能接 8 套：526-000006 成品 30 套，现有库存还能做 11 套，先扣掉已签约欠货 33 套，可承诺 8 套。
    expected:
      accept_qty: 8
      fg_qty: 30
      buildable_qty: 11
      backlog_qty: 33
      available_to_promise: 8
    surfaces:
    - agent
  - id: Q-25
    title: 卡在哪颗料
    explanation: 欠货先用现货，剩下的按 BOM 逐层净扣找出最底层缺料，再看每颗料有没有在途。
    question: 625 农业无人飞机 367-000097 的欠单还差几套补不上？卡在哪些料？哪些可以催在途，哪些得新下单、最早哪天到？
    answer: 还差 4 套补不上，卡在 3 颗包装料，各缺 4 个：165-002619、606-000691、606-000692。606-000692 有逾期在途可以催；165-002619 和 606-000691 没有在途要新下单，最早 2026-09-08 到。
    expected:
      short_sets: 4
      blocking_materials:
        165-002619: 4
        606-000691: 4
        606-000692: 4
      chase_open_po:
      - 606-000692
      new_order_needed:
      - 165-002619
      - 606-000691
      earliest_new_order_arrival: '2026-09-08'
    surfaces:
    - agent
  - id: Q-46
    title: 催回在途能多做多少
    explanation: 先算现有库存可做数量和卡住的物料，再假设逾期在途全部催回，对比可做数量。
    question: U00-000080 车载终端用现有库存最多还能做多少套？再多做一套卡在哪颗料？如果逾期没到的采购都能催回来，最多能做多少套？
    answer: U00-000080 用现有库存最多还能做 141 套，再多做一套卡在 994-000328；如果逾期没到的采购都能催回来，最多能做 2972 套。
    expected:
      stock_only_buildable: 141
      first_blocking_materials:
      - 994-000328
      with_overdue_po_chased: 2972
    surfaces:
    - agent
