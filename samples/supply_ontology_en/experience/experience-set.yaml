apiVersion: samples.openbkn.ai/v1alpha1
kind: ExperienceSet
metadata:
  language: en-US
  source:
    answerSet: bkn-eval/baselines/2026-10-30-business-scenarios-v4/answer-set-v4.yaml
    setId: supply-business-scenarios-v4
spec:
  businessDate: '2026-08-25'
  cases:
  - id: Q-05
    title: What we owe customers
    explanation: Compare signed and shipped quantities on sales orders to find orders not fully shipped and the units owed.
    question: How many sales orders are not fully shipped yet, and how many units do we still owe customers in total?
    answer: 192 sales orders are not fully shipped; we owe customers 470 units in total.
    expected:
      orders: 192
      unshipped_qty: 470
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (s:supply_ontology_en_salesorder)
        WHERE s.signing_quantity > s.shipping_quantity
        RETURN count(*) AS orders, sum(s.signing_quantity - s.shipping_quantity) AS unshipped_qty
  - id: Q-04
    title: Finished goods ready to ship
    explanation: Follow the product-to-stock relation and count only Available stock in the three finished-goods warehouses.
    question: How much available stock of 382-000005, the BeiDou navigation farm autopilot, is left in the three finished-goods warehouses?
    answer: 382-000005 has 534 units of Available stock across the Suzhou, Urumqi and Harbin finished-goods warehouses.
    expected:
      qty: 534
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (p:supply_ontology_en_product {material_number: '382-000005'})-[:supply_ontology_en_prod2inv]->(i:supply_ontology_en_inventory)
        WHERE i.warehouse IN ['Suzhou Finished Goods', 'Urumqi Finished Goods', 'Harbin Finished Goods'] AND i.stock_status = 'Available'
        RETURN sum(i.available_inventory_qty) AS qty
      graph: |-
        MATCH (p:supply_ontology_en_product {material_number: '382-000005'})-[:supply_ontology_en_prod2inv]->(i:supply_ontology_en_inventory)
        WHERE i.warehouse IN ['Suzhou Finished Goods', 'Urumqi Finished Goods', 'Harbin Finished Goods'] AND i.stock_status = 'Available'
  - id: Q-06
    title: Open forecasts
    explanation: Count forecasts whose close status is not Closed to see the forecast load still ahead.
    question: How many demand forecasts are still open, and how many units do they add up to?
    answer: 90 demand forecasts are still open, 56340 units in total.
    expected:
      count: 90
      qty: 56340
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (f:supply_ontology_en_forecast)
        WHERE f.closestatus_title <> 'Closed'
        RETURN count(*) AS count, sum(f.qty) AS qty
  - id: Q-09
    title: The most overdue order
    explanation: Compare each owed order's promised date with the business date 2026-08-25 and find the one late the longest.
    question: Among the orders we still owe, how many are past their promised date? Which one is the most overdue, and by how many days?
    answer: All 192 owed orders are past their promised date; the most overdue is SO0000538, promised for 2026-03-16 and 162 days late.
    expected:
      overdue_orders: 192
      oldest_order: SO0000538
      days_late: 162
    surfaces:
    - agent
  - id: Q-14
    title: Where a part is used
    explanation: Trace the material back to the main-part rows of each product BOM to find the products it affects.
    question: Which finished products use seal ring 165-002537?
    answer: 'Seal ring 165-002537 is used in 5 products: 367-000061, 367-000097, 367-000102, 367-000130 and 367-000131.'
    expected:
      product_codes:
      - 367-000061
      - 367-000097
      - 367-000102
      - 367-000130
      - 367-000131
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (b:supply_ontology_en_bom)-[:supply_ontology_en_bom2mat]->(m:supply_ontology_en_material {material_code: '165-002537'})
        WHERE b.alt_priority = 0 AND b.bom_level > 0
        RETURN DISTINCT b.bom_material_code AS product_codes
      graph: |-
        MATCH (p:supply_ontology_en_product)-[:supply_ontology_en_prod2bom]->(b:supply_ontology_en_bom)-[:supply_ontology_en_bom2mat]->(m:supply_ontology_en_material {material_code: '165-002537'})
        WHERE b.alt_priority = 0 AND b.bom_level > 0
  - id: Q-11
    title: Overdue purchases
    explanation: Among open lines that are not closed, not terminated and not fully received, those due before the business date are overdue.
    question: How many purchase lines are past their due date and still not fully received? How many suppliers do they involve?
    answer: 483 purchase lines are past their due date and still not fully received, from 133 suppliers.
    expected:
      lines: 483
      suppliers: 133
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (po:supply_ontology_en_po)
        WHERE po.rowclosestatus_title = 'Open' AND po.rowterminatestatus_title = 'Open' AND po.qty - po.actqty > 0 AND po.deliverdate < '2026-08-25'
        RETURN count(*) AS lines, count(DISTINCT po.supplier_number) AS suppliers
  - id: Q-12
    title: Which supplier to chase first
    explanation: Total overdue lines and open quantities by supplier to find the one to chase first.
    question: Which supplier has the most overdue purchase lines? How many lines, and how much do they still owe us?
    answer: 'Ashvale Components has the most overdue lines: 50 lines not received, 2844000 units still owed.'
    expected:
      supplier: Ashvale Components
      lines: 50
      open_qty: 2844000
    surfaces:
    - agent
    - query
    cypher:
      query: |-
        MATCH (po:supply_ontology_en_po)
        WHERE po.rowclosestatus_title = 'Open' AND po.rowterminatestatus_title = 'Open' AND po.qty - po.actqty > 0 AND po.deliverdate < '2026-08-25'
        RETURN po.supplier_name AS supplier, count(*) AS lines, sum(po.qty - po.actqty) AS open_qty
        ORDER BY lines DESC
        LIMIT 1
  - id: Q-20
    title: Ordered today, arriving when
    explanation: The standard purchasing lead time counted from the business date gives the earliest arrival.
    question: If we order SMD crystal 527-000017 today, what is the earliest date it can arrive?
    answer: SMD crystal 527-000017 has a 70-day lead time; ordered today (2026-08-25) it arrives 2026-11-03 at the earliest.
    expected:
      arrival_date: '2026-11-03'
    surfaces:
    - agent
  - id: Q-35
    title: Who the material was bought for
    explanation: Follow the purchase line to its requisition line, MRP planned order and demand forecast.
    question: 'Purchase order 02-KSHA-CGDD-260402-012958, line 849-000904: which purchase requisition did it come from? Which MRP planned order generated that requisition? In the end, which forecast and
      which product was the material bought for?'
    answer: The line came from requisition CGSQ-260331-000026, generated by MRP planned order JHJY-20260331-00045866, and was bought for product P69-000060 in forecast YCD2026020500000045.
    expected:
      purchase_request: CGSQ-260331-000026
      mrp_plan_order: JHJY-20260331-00045866
      forecast: YCD2026020500000045
      product_codes:
      - P69-000060
    surfaces:
    - agent
    - query
    - graph
    cypher:
      query: |-
        MATCH (po:supply_ontology_en_po {billno: '02-KSHA-CGDD-260402-012958', material_number: '849-000904'})-[:supply_ontology_en_pr2po]->(pr:supply_ontology_en_pr)-[:supply_ontology_en_pr2mrp]->(m:supply_ontology_en_mrp)-[:supply_ontology_en_mrp2fcst]->(f:supply_ontology_en_forecast)
        RETURN DISTINCT pr.billno AS purchase_request, m.billno AS mrp_plan_order, f.billno AS forecast, f.material_number AS product_codes
      graph: 'MATCH (po:supply_ontology_en_po {billno: ''02-KSHA-CGDD-260402-012958'', material_number: ''849-000904''})-[:supply_ontology_en_pr2po]->(pr:supply_ontology_en_pr)-[:supply_ontology_en_pr2mrp]->(m:supply_ontology_en_mrp)-[:supply_ontology_en_mrp2fcst]->(f:supply_ontology_en_forecast)'
  - id: Q-23
    title: Backlog beyond stock on hand
    explanation: Compare each product's owed units with its Available finished-goods stock across the company.
    question: Which products already owe customers more than we have in finished-goods stock? By how many units each?
    answer: '8 products owe more than their finished-goods stock: 367-000097 short 4, 367-000102 short 9, 367-000130 short 21, 367-000131 short 15, 526-000006 short 3, 590-000100 short 18, 734-000001 short
      1, P61-000351 short 12.'
    expected:
      products:
        367-000097: 4
        367-000102: 9
        367-000130: 21
        367-000131: 15
        526-000006: 3
        590-000100: 18
        734-000001: 1
        P61-000351: 12
    surfaces:
    - agent
  - id: Q-24
    title: Backlog production cannot cover
    explanation: For the part stock on hand cannot cover, net the BOM level by level to see what current stock can build; what remains is the real gap.
    question: Of the products where finished goods can't cover the backlog, which can't be built from current stock either? How many units short is each?
    answer: '5 products cannot be covered by stock on hand or current stock: 367-000097 short 4, 367-000102 short 9, 367-000130 short 21, 367-000131 short 15, 734-000001 short 1.'
    expected:
      products:
        367-000097: 4
        367-000102: 9
        367-000130: 21
        367-000131: 15
        734-000001: 1
    surfaces:
    - agent
  - id: Q-27
    title: Which owed order first
    explanation: Fill owed orders from stock on hand by promised date, then check whether current stock can build the rest.
    question: If we ship the 526-000006 backlog from stock on hand in promised-date order, which orders can't be filled? Can the shortfall be built from current stock?
    answer: After 30 units of 526-000006 stock on hand are shipped by promised date, SO0000592 and SO0000096 are not filled, 3 units short; current stock can build 11 more, enough to cover them.
    expected:
      unmet_orders:
      - SO0000592
      - SO0000096
      remaining_qty: 3
      can_build: true
    surfaces:
    - agent
  - id: Q-28
    title: How much more we can accept
    explanation: Available to promise = finished-goods stock + what current stock can build − signed backlog, protecting owed orders first.
    question: A customer wants another 30 units of 526-000006. How many can we accept right now?
    answer: 'We can accept 8 at most: 526-000006 has 30 units of finished goods and current stock can build 11 more; after the 33 units of signed backlog, 8 can be promised.'
    expected:
      accept_qty: 8
      fg_qty: 30
      buildable_qty: 11
      backlog_qty: 33
      available_to_promise: 8
    surfaces:
    - agent
  - id: Q-25
    title: Which material blocks it
    explanation: Use stock on hand for the backlog first, net the rest through the BOM to find bottom-level shortages, then check each one for open purchases.
    question: For the 625 agricultural drone 367-000097, how many backlog units can't be covered? Which materials block it? Which can we expedite from open purchase orders, which need a new order, and what
      is the earliest date everything is in?
    answer: '4 units cannot be covered, blocked by 3 packaging parts short 4 each: 165-002619, 606-000691 and 606-000692. 606-000692 has an overdue open purchase to expedite; 165-002619 and 606-000691 have
      nothing on order and need a new order, arriving 2026-09-08 at the earliest.'
    expected:
      short_sets: 4
      blocking_materials:
        165-002619: 4
        606-000691: 4
        606-000692: 4
      chase_open_po:
      - 606-000692
      new_order_needed:
      - 165-002619
      - 606-000691
      earliest_new_order_arrival: '2026-09-08'
    surfaces:
    - agent
  - id: Q-46
    title: What chasing purchases adds
    explanation: Work out what current stock can build and which material blocks it, then assume every overdue purchase is chased in and compare.
    question: How many more units of vehicle terminal U00-000080 can current stock build at most? Which material blocks one more unit? If every overdue purchase could be chased in, how many could we build?
    answer: Current stock can build 141 more units of U00-000080, and one more is blocked by 994-000328; if every overdue purchase were chased in, it could build 2972.
    expected:
      stock_only_buildable: 141
      first_blocking_materials:
      - 994-000328
      with_overdue_po_chased: 2972
    surfaces:
    - agent
