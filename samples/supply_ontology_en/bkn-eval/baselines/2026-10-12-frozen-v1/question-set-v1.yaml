snapshot_kind: repository_fixture_freeze
baseline_id: supply-en-frozen-v1
snapshot_note: Frozen supply-chain fixture with three future forecast scenarios.
evaluation_policy:
  inventory_scope: all unless explicitly specified
  stock_status: Available
  quantity_supply: inventory only; exclude PO and new procurement
  allocation: finished goods first, each component stock before expansion; shared
    pool; array order then BOM row order
  substitution: one candidate per position; own usage; max parent coverage; ties main
    then source order
  date_supply: existing net unreceived PO only, today < deliverdate <= need_by; overdue/undated
    exclude from confirmed coverage
  date_claim: closed-world confirmed supply coverage, not unknown future procurement
    promise
