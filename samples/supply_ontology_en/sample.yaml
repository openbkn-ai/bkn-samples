apiVersion: samples.openbkn.ai/v1alpha1
kind: Sample
metadata:
  language: en-US
  name: supply-chain-en
  aliases: []
  displayName: Supply Chain (EN)
  summary: Use sample orders, stock, BOMs and purchases to fill backlog, accept orders and follow up purchases.
spec:
  studio:
    licenseNote: Fictional historical data for demonstration only.
    questions:
      - A customer wants another 30 units of 526-000006. How many can we accept right now?
      - Which products' backlog can neither stock on hand nor current stock cover?
    experienceSet: experience/experience-set.yaml
  database:
    engine: mariadb
    name: supply_demo_en
    expectedTables: 12
  data:
    mode: embedded
  knowledgeNetwork:
    id: supply_ontology_en
    displayName: Supply Chain EN
  capabilities:
    required: true
  components:
    objects: true
    relations: true
    metrics: false
    functions: true
    skills: true
  hooks:
    dbInit: db/init.sh
    dbVerify: db/verify.sh
    platformInstall: platform/install.sh
    platformVerify: platform/verify.sh
