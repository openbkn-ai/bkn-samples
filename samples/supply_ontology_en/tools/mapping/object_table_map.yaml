objects:
  - object_type_id: supply_ontology_en_material
    table: erp_material
    primary_keys:
      - material_code
    bind: true

  - object_type_id: supply_ontology_en_product
    table: hd_product_view
    primary_keys:
      - material_code
    bind: true

  - object_type_id: supply_ontology_en_bom
    table: erp_material_bom
    primary_keys:
      - bom_version
      - bom_material_code
      - seq_no
    bind: true

  - object_type_id: supply_ontology_en_inventory
    table: erp_real_time_inventory
    primary_keys:
      - id
    bind: true

  - object_type_id: supply_ontology_en_supplier
    table: erp_supplier
    primary_keys:
      - supplier_code
    bind: true

  - object_type_id: supply_ontology_en_forecast
    table: erp_mds_forecast
    primary_keys:
      - id
    bind: true

  - object_type_id: supply_ontology_en_mrp
    table: erp_mrp_plan_order
    primary_keys:
      - billno
    bind: true

  - object_type_id: supply_ontology_en_pr
    table: erp_purchase_request
    primary_keys:
      - entry_id
    bind: true

  - object_type_id: supply_ontology_en_po
    table: erp_purchase_order
    primary_keys:
      - entry_id
    bind: true

  - object_type_id: supply_ontology_en_mps
    table: erp_production_work_order
    primary_keys:
      - entry_id
    bind: true

  - object_type_id: supply_ontology_en_salesorder
    table: sales_order
    primary_keys:
      - sales_order_id
    bind: true

load_only_tables:
  - customer_entity

load_order:
  - erp_material
  - hd_product_view
  - erp_material_bom
  - erp_real_time_inventory
  - erp_supplier
  - erp_mds_forecast
  - erp_mrp_plan_order
  - erp_purchase_request
  - erp_purchase_order
  - erp_production_work_order
  - customer_entity
  - sales_order

join_checks:
  - name: so_to_product
    left_table: sales_order
    left_key: product_code
    right_table: hd_product_view
    right_key: material_code
    expect_hit_rate: 1.0

  - name: bom_material_exists
    left_table: erp_material_bom
    left_key: material_code
    right_table: erp_material
    right_key: material_code
    expect_hit_rate: 1.0

  - name: po_to_supplier
    left_table: erp_purchase_order
    left_key: supplier_number
    right_table: erp_supplier
    right_key: supplier_code
    expect_hit_rate: 1.0

  - name: po_to_pr
    left_table: erp_purchase_order
    left_key: srcbillentryid
    right_table: erp_purchase_request
    right_key: entry_id
    # Sample export: ~4.5% PO lines reference PR entry_id not present in erp_purchase_request.csv
    expect_hit_rate: 0.95

  - name: product_has_forecast
    left_table: hd_product_view
    left_key: material_code
    right_table: erp_mds_forecast
    right_key: material_number
    expect_hit_rate: 1.0
