apiVersion: samples.openbkn.ai/v1alpha1
kind: Sample
metadata:
  name: world-cup
  aliases: []
  displayName: 世界杯
  summary: 用公开的世界杯数据体验对象查询、多表关联和跨届分析。
spec:
  studio:
    licenseNote: CC-BY-SA 4.0 · Joshua C. Fjelstul
    questions:
      - 梅西在世界杯获得过哪些奖？
      - 近三届男足世界杯的冠军是谁？
  database:
    engine: mariadb
    name: worldcup
    expectedTables: 27
  data:
    mode: embedded
  knowledgeNetwork:
    id: worldcup_vega_catalog_bkn
    displayName: 世界杯
  capabilities:
    required: false
  components:
    objects: true
    relations: true
    metrics: false
    functions: false
    skills: false
  hooks:
    dbInit: db/init.sh
    dbVerify: db/verify.sh
    platformInstall: platform/install.sh
    platformVerify: platform/verify.sh
