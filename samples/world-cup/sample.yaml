apiVersion: samples.openbkn.ai/v1alpha1
kind: Sample
metadata:
  language: zh-CN
  name: world-cup
  aliases: []
  displayName: 世界杯
  summary: 用公开的世界杯历史数据查询赛事、球队、球员和比赛事件。
spec:
  studio:
    licenseNote: CC-BY-SA 4.0 · Joshua C. Fjelstul
    questions:
    - 2022 年世界杯决赛是哪天、谁对谁？比分多少？点球大战比分多少？
    - 梅西在 2014 年和 2022 年世界杯拿过哪些奖？
    - 1950 年世界杯有决赛吗？冠军是怎么决出的？最后阶段踢了几场？
    experienceSet: experience/experience-set.yaml
  database:
    engine: mariadb
    name: worldcup
    expectedTables: 27
  data:
    mode: embedded
  knowledgeNetwork:
    id: worldcup_vega_catalog_bkn
    displayName: 世界杯
  capabilities:
    required: true
  components:
    objects: true
    relations: true
    metrics: false
    functions: false
    skills: true
  hooks:
    dbInit: db/init.sh
    dbVerify: db/verify.sh
    platformInstall: platform/install.sh
    platformVerify: platform/verify.sh
