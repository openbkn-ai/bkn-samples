schema_version: '1.0'
set_id: worldcup-cn-core50-v1
baseline_id: worldcup-cn-fjelstul-v1
scope: 冻结快照：男足截至 2022 年、女足截至 2019 年。各明细表覆盖范围不同。所有业务值保留源记录。
categories:
- id: B
  name: 基础查询统计
  question_count: 10
- id: J
  name: 多表关联
  question_count: 12
- id: R
  name: 排名和跨届对比
  question_count: 14
- id: A
  name: 综合分析
  question_count: 14
scoring:
  result_grain: 按 output_fields 命名的结果行，遵守 row_order 排序。
  competition_ranking: 竞赛排名：并列者使用相同名次，后续名次跳过被并列占据的位置；返回指定排名边界内的全部行。
  numeric_tolerance: 0.0005
  names: 保留源数据的英文拼写及重音符号，以 ID 确定身份。人员全名按 given_name 加空格加 family_name 返回。
  output_contract: 必须包含每题 output_fields 中的全部字段，可以增加解释字段。
  object_resolution: required_objects 指定主要对象。允许关联其他已发布对象补全阶段或名称；不能使用未声明的字段、运行时 SQL、Vega
    内部查询 API 或平台内部 bkn-agent。
questions:
- id: B-01
  category: B
  difficulty: 1
  question: 冻结数据快照中包含多少届男足世界杯和女足世界杯？分别返回届数。 competition 使用 men、women 标识两类赛事。
  required_objects:
  - tournaments
  output_fields:
  - competition
  - editions
  row_order: competition 升序
- id: B-02
  category: B
  difficulty: 1
  question: 冻结数据快照一共记录了多少场比赛？按比赛记录计数，每场只计一次。
  required_objects:
  - matches
  output_fields:
  - matches
  row_order: 单行结果
- id: B-03
  category: B
  difficulty: 1
  question: 给出 WC-2022 的年份、开始日期、结束日期、主办方和冠军。
  required_objects:
  - tournaments
  output_fields:
  - year
  - start_date
  - end_date
  - host_country
  - winner
  row_order: 单行结果
- id: B-04
  category: B
  difficulty: 1
  question: 按男足代表队标记 mens_team 和女足代表队标记 womens_team 的组合，分别统计球队记录数。
  required_objects:
  - teams
  output_fields:
  - mens_team
  - womens_team
  - teams
  row_order: mens_team, 再按 womens_team 升序
- id: B-05
  category: B
  difficulty: 1
  question: 按 female 标记分别统计球员记录数。
  required_objects:
  - players
  output_fields:
  - female
  - players
  row_order: female 升序
- id: B-06
  category: B
  difficulty: 1
  question: 统计 WC-2022 得牌记录中 yellow_card=1、red_card=1、second_yellow_card=1、sending_off=1
    的数量，分别返回。各标记可能重叠，不能相加作为独立事件总数。
  required_objects:
  - bookings
  output_fields:
  - yellow_cards
  - red_cards
  - second_yellows
  - sendings_off
  row_order: 单行结果
- id: B-07
  category: B
  difficulty: 1
  question: 给出 WC-2022 决赛的比赛 ID、日期、主客队名称、比赛比分和点球大战比分。通过已发布的比赛、球队及裁判场次对象定位决赛并补全名称。
  required_objects:
  - matches
  - teams
  - referee_appearances
  output_fields:
  - match_id
  - match_date
  - home_team_name
  - away_team_name
  - score
  - score_penalties
  row_order: match_id 升序
- id: B-08
  category: B
  difficulty: 1
  question: 统计 WC-2022 的比赛进球事件：分别返回全部进球、排除乌龙球后的进球、乌龙球和 penalty=1 的比赛内点球进球数量。
  required_objects:
  - goals
  output_fields:
  - all_goals
  - personal_goals
  - own_goals
  - match_penalties
  row_order: 单行结果
- id: B-09
  category: B
  difficulty: 1
  question: 当前快照记录了多少条 WC-1999 球员上场记录？只报告已记录行数，不据此推断现实中的参赛情况。
  required_objects:
  - player_appearances
  output_fields:
  - recorded_appearances
  row_order: 单行结果
- id: B-10
  category: B
  difficulty: 1
  question: 列出快照中容量最大的所有并列球场，返回球场 ID、名称和容量。
  required_objects:
