apiVersion: samples.openbkn.ai/v1alpha1
kind: Sample
metadata:
  language: en-US
  name: world-cup-en
  aliases: []
  displayName: World Cup (EN)
  summary: Explore World Cup tournaments, teams, players and match events.
spec:
  studio:
    licenseNote: CC-BY-SA 4.0 · Joshua C. Fjelstul
    questions:
    - When was the 2022 World Cup final, who played, what was the score, and what
      was the shootout score?
    - Which awards did Lionel Messi win at the 2014 and 2022 World Cups?
    - Did the 1950 World Cup have a final? How was the winner decided, and how many
      matches were played in the deciding stage?
    experienceSet: experience/experience-set.yaml
  database:
    engine: mariadb
    name: worldcup_en
    expectedTables: 27
  data:
    mode: embedded
  knowledgeNetwork:
    id: worldcup_en
    displayName: World Cup
  capabilities:
    required: true
  components:
    objects: true
    relations: true
    metrics: false
    functions: false
    skills: true
  hooks:
    dbInit: db/init.sh
    dbVerify: db/verify.sh
    platformInstall: platform/install.sh
    platformVerify: platform/verify.sh
