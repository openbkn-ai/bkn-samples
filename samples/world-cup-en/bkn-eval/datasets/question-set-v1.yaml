schema_version: '1.0'
set_id: worldcup-en-core50-v1
baseline_id: worldcup-en-fjelstul-v1
scope: 'Locked snapshot: men through 2022, women through 2019; detail-table coverage
  varies.'
categories:
- id: B
  name: basic_query_statistics
  question_count: 10
- id: J
  name: multi_table_joins
  question_count: 12
- id: R
  name: rankings_cross_tournament
  question_count: 14
- id: A
  name: combined_analysis
  question_count: 14
scoring:
  result_grain: ordered rows with named columns
  competition_ranking: Equal counts share rank; the next rank skips tied positions.
    Return all rows inside the stated rank boundary.
  numeric_tolerance: 0.0005
  names: Preserve source spelling and accents; IDs identify entities.
  output_contract: Use output_fields as column names and return ordered row objects.
    Extra explanatory fields are permitted, but every required field must be present.
questions:
- id: B-01
  category: B
  difficulty: 1
  question: How many men’s and women’s tournament editions are in the snapshot? Return
    one count for each competition.
  required_objects:
