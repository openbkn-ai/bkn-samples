name: Retest fixed SWR candidate

on:
  push:
    # Deliberately does not match the publication workflow's 66-swr-* pattern.
    branches: ["validation/66-cold-*"]

permissions:
  contents: read

jobs:
  cold-pull:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify the fixed published candidate anonymously
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          # Reviewed tuple from publication evidence; no arbitrary tag input.
          CANDIDATE_VERSION: "0.2.1-main.20261023203838.sha3cae3a2"
          CANDIDATE_SOURCE: "3cae3a2ffdf2fd96e6958a634cfb238cc17c8228"
          PUBLICATION_RUN: "40020812230"
          SERVICE_DIGEST: "sha256:faf8d579ec649b7e1cc723b191320c69c7062cbba57cbd6629fe47b07247153f"
          DATA_DIGEST: "sha256:3707d8f8f6ba6603e3fb4e67dbf58c7e3fa5a58c1d291c294e062b52f17b114a"
        run: bash installer/ci/verify_swr_cold_pull.sh
      - name: Retain evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swr-cold-pull-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cold-pull-evidence/
          if-no-files-found: error
          retention-days: 14
