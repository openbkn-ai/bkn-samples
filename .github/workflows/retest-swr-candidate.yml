name: Retest fixed SWR candidate

on:
  push:
    # Deliberately does not match the publication workflow's 66-swr-* pattern.
    branches: ["validation/66-cold-*"]

permissions:
  contents: read

jobs:
  cold-pull:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify the fixed published candidate anonymously
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          # Reviewed tuple from publication evidence; no arbitrary tag input.
          CANDIDATE_VERSION: "0.2.1-main.20261023231122.shafe82a5e"
          CANDIDATE_SOURCE: "fe82a5e54a181df4a6648c93c1e3d5f28e1db0dc"
          PUBLICATION_RUN: "40038227668"
          SERVICE_DIGEST: "sha256:172c9750ac9e350235b1966732600ce420e08eddce20284c92954e17bf4a9130"
          DATA_DIGEST: "sha256:ebd85b0443480ccd95361a2e29734ccf5a7090085b2092935725707c6212c912"
        run: bash installer/ci/verify_swr_cold_pull.sh
      - name: Retain evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swr-cold-pull-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cold-pull-evidence/
          if-no-files-found: error
          retention-days: 14
