name: Publish sample image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the tag to match VERSION
        id: version
        run: |
          test -n "${SWR_PASSWORD}" && test -n "${SWR_USERNAME}" || { echo "SWR credentials are required for a standard release" >&2; exit 1; }
          python -m pip install "PyYAML>=6"
          version="$(PYTHONPATH=. python installer/release.py check-tag --tag "${GITHUB_REF_NAME}")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "${SWR_PASSWORD}" ]]; then
            echo "swr=true" >> "$GITHUB_OUTPUT"
          else
            echo "swr=false" >> "$GITHUB_OUTPUT"
          fi
          for arch in amd64 arm64; do
            {
              echo "tags_${arch}<<EOF"
              echo "ghcr.io/openbkn-ai/bkn-samples:${version}-${arch}"
              if [[ -n "${SWR_PASSWORD}" ]]; then
                echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}-${arch}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done
      - name: Write the manifest index for this commit
        run: python installer/build_manifest_index.py --revision "${GITHUB_SHA}" --output manifest-index.json --samples supply-chain world-cup
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.version.outputs.swr == 'true'
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      # Push each architecture using Docker v2 media types; Basic SWR rejects OCI manifests.
      # Publish a Docker manifest list below after both architecture images are available.
      - name: Build and push the sample image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.tags_amd64 }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the sample image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.tags_arm64 }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Publish Docker manifest lists
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SWR_ENABLED: ${{ steps.version.outputs.swr }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local repository="$1"
            local image="$2"
            local reference="${repository}/${image}:${VERSION}"
            docker manifest create "${reference}" \
              "${repository}/${image}:${VERSION}-amd64" \
              "${repository}/${image}:${VERSION}-arm64"
            docker manifest push "${reference}"
          }

          publish_manifest ghcr.io/openbkn-ai bkn-samples
          if [[ "${SWR_ENABLED}" == "true" ]]; then
            publish_manifest swr.cn-east-3.myhuaweicloud.com/openbkn-ai bkn-samples
          fi
      - name: Verify SWR sample image platforms
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          repository=swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repository}:${version}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${repository}@${digest}" > /tmp/swr-data-manifest.json
          PYTHONPATH=. python installer/verify_image_manifest.py /tmp/swr-data-manifest.json
