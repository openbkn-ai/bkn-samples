name: Publish sample image

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the tag to match VERSION
        id: version
        run: |
          python -m pip install "PyYAML>=6"
          version="$(PYTHONPATH=. python installer/release.py check-tag --tag "${GITHUB_REF_NAME}")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "${SWR_PASSWORD}" ]]; then
            echo "swr=true" >> "$GITHUB_OUTPUT"
          else
            echo "swr=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/openbkn-ai/bkn-samples:${version}"
            if [[ -n "${SWR_PASSWORD}" ]]; then
              echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Write the manifest index for this commit
        run: python installer/build_manifest_index.py --revision "${GITHUB_SHA}" --output manifest-index.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.version.outputs.swr == 'true'
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.tags }}
      - name: Require SWR and GHCR digests to match
        if: steps.version.outputs.swr == 'true'
        run: |
          version="${{ steps.version.outputs.value }}"
          swr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}")"
          ghcr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/openbkn-ai/bkn-samples:${version}")"
          PYTHONPATH=. python installer/release.py check-digests --left "$swr" --right "$ghcr"
