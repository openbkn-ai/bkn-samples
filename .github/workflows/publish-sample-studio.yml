name: Publish sample catalog service

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
      - name: Require the tag to match VERSION
        id: version
        run: |
          python -m pip install "PyYAML>=6"
          version="$(PYTHONPATH=. python installer/release.py check-tag --tag "${GITHUB_REF_NAME}")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/studio/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/openbkn-ai/bkn-sample-studio:${{ steps.version.outputs.value }}
            swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${{ steps.version.outputs.value }}
      - name: Require SWR and GHCR digests to match
        run: |
          version="${{ steps.version.outputs.value }}"
          swr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${version}")"
          ghcr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/openbkn-ai/bkn-sample-studio:${version}")"
          PYTHONPATH=. python installer/release.py check-digests --left "$swr" --right "$ghcr"
      - name: Package the chart for the same version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/__VERSION__/${VERSION}/g" deploy/charts/bkn-sample-studio/values.yaml
          helm lint deploy/charts/bkn-sample-studio
          helm package deploy/charts/bkn-sample-studio --destination /tmp/charts
      - name: Push the chart
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/bkn-sample-studio-${{ steps.version.outputs.value }}.tgz" "oci://ghcr.io/openbkn-ai/charts"
