name: Publish sample catalog service

on:
  push:
    branches: [main, "validation/66-swr-*"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_branch:
        description: Release branch to build and publish (release/X.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      service_digest: ${{ steps.manifest.outputs.service_digest }}
      data_digest: ${{ steps.manifest.outputs.data_digest }}
    env:
      # Standard charts may only reference verified SWR artifacts.
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.source_branch) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
      - name: Resolve the image and chart version
        id: version
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          test -n "${SWR_PASSWORD}" && test -n "${SWR_USERNAME}" || { echo "SWR credentials are required for a standard release" >&2; exit 1; }
          python -m pip install "PyYAML>=6"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${SOURCE_BRANCH}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "source_branch must be release/X.Y.Z" >&2
              exit 1
            fi
            base_version="$(cat VERSION)"
            if [[ "${BASH_REMATCH[1]}" != "${base_version}" ]]; then
              echo "source_branch version must match VERSION ${base_version}" >&2
              exit 1
            fi
            stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
            sha="$(git rev-parse --short=7 HEAD)"
            version="${base_version}-release.${stamp}.sha${sha}"
          elif [[ "${GITHUB_REF_NAME}" == validation/66-swr-* ]]; then
            version="$(cat VERSION)-rc.66.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(PYTHONPATH=. python installer/release.py check-tag --tag "${GITHUB_REF_NAME}")"
          else
            stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
            sha="$(git rev-parse --short=7 HEAD)"
            version="$(PYTHONPATH=. python installer/release.py main-build --committed-at "${stamp}" --sha "${sha}")"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "${SWR_PASSWORD}" ]]; then
            echo "swr=true" >> "$GITHUB_OUTPUT"
          else
            echo "swr=false" >> "$GITHUB_OUTPUT"
          fi
          for arch in amd64 arm64; do
            {
              echo "service_${arch}_tags<<EOF"
              echo "ghcr.io/openbkn-ai/bkn-sample-studio:${version}-${arch}"
              if [[ -n "${SWR_PASSWORD}" ]]; then
                echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${version}-${arch}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "data_${arch}_tags<<EOF"
              echo "ghcr.io/openbkn-ai/bkn-samples:${version}-${arch}"
              if [[ -n "${SWR_PASSWORD}" ]]; then
                echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}-${arch}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done
      - name: Write the manifest index for this commit
        # Match the samples actually copied by installer/image/Dockerfile.
        # Other samples are delivered through fixed packages and the catalog.
        run: PYTHONPATH=. python installer/build_manifest_index.py --revision "$(git rev-parse HEAD)" --output manifest-index.json --samples supply-chain world-cup
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.version.outputs.swr == 'true'
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      # Push each architecture using Docker v2 media types; Basic SWR rejects OCI manifests.
      # Publish Docker manifest lists below after both architecture images are available.
      - name: Build and push the service image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/studio/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.service_amd64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the service image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/studio/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.service_arm64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the sample data image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.data_amd64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the sample data image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.data_arm64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Publish Docker manifest lists
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SWR_ENABLED: ${{ steps.version.outputs.swr }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local repository="$1"
            local image="$2"
            local reference="${repository}/${image}:${VERSION}"
            docker manifest create "${reference}" \
              "${repository}/${image}:${VERSION}-amd64" \
              "${repository}/${image}:${VERSION}-arm64"
            docker manifest push "${reference}"
          }

          publish_manifest ghcr.io/openbkn-ai bkn-sample-studio
          if [[ "${SWR_ENABLED}" == "true" ]]; then
            publish_manifest swr.cn-east-3.myhuaweicloud.com/openbkn-ai bkn-sample-studio
          fi

          publish_manifest ghcr.io/openbkn-ai bkn-samples
          if [[ "${SWR_ENABLED}" == "true" ]]; then
            publish_manifest swr.cn-east-3.myhuaweicloud.com/openbkn-ai bkn-samples
          fi

          service_ref="swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${VERSION}"
          service_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${service_ref}")"
          [[ "${service_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio@${service_digest}" > /tmp/swr-service-manifest.json
          PYTHONPATH=. python installer/verify_image_manifest.py /tmp/swr-service-manifest.json
          printf 'service_digest=%s\n' "${service_digest}" >> "$GITHUB_OUTPUT"
          data_repository=swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples
          data_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${data_repository}:${VERSION}")"
          [[ "${data_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${data_repository}@${data_digest}" > /tmp/swr-data-manifest.json
          PYTHONPATH=. python installer/verify_image_manifest.py /tmp/swr-data-manifest.json
          printf 'data_digest=%s\n' "${data_digest}" >> "$GITHUB_OUTPUT"
      - name: Package the chart for the same version
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SERVICE_IMAGE_DIGEST: ${{ steps.manifest.outputs.service_digest }}
        run: |
          [[ "${SERVICE_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/__VERSION__/${VERSION}/g" deploy/charts/bkn-sample-studio/values.yaml
          sed -i "s/^  digest: .*/  digest: \"${SERVICE_IMAGE_DIGEST}\"/" deploy/charts/bkn-sample-studio/values.yaml
          helm lint deploy/charts/bkn-sample-studio
          helm package deploy/charts/bkn-sample-studio --destination /tmp/charts
      - name: Verify published Chart identities
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SERVICE_DIGEST: ${{ steps.manifest.outputs.service_digest }}
          DATA_DIGEST: ${{ steps.manifest.outputs.data_digest }}
        run: |
          mkdir publication-evidence
          helm template candidate "/tmp/charts/bkn-sample-studio-${VERSION}.tgz" > /tmp/candidate-rendered.yaml
          python installer/ci/verify_candidate_chart.py /tmp/candidate-rendered.yaml "$SERVICE_DIGEST" "$VERSION" publication-evidence/chart-images.json
          cp /tmp/charts/*.tgz /tmp/swr-*-manifest.json publication-evidence/
          printf 'version=%s\nsource=%s\nservice_digest=%s\ndata_digest=%s\n' "$VERSION" "$GITHUB_SHA" "$SERVICE_DIGEST" "$DATA_DIGEST" > publication-evidence/identities.txt
          sha256sum publication-evidence/*.tgz > publication-evidence/chart-sha256.txt
      - name: Push the chart
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/bkn-sample-studio-${{ steps.version.outputs.value }}.tgz" "oci://ghcr.io/openbkn-ai/charts"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/validation/66-swr-')
        with:
          name: swr-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/
          retention-days: 14

  candidate-cold-pull:
    if: startsWith(github.ref, 'refs/heads/validation/66-swr-')
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pull both immutable candidates into separate empty stores
        env:
          SERVICE_DIGEST: ${{ needs.publish.outputs.service_digest }}
          DATA_DIGEST: ${{ needs.publish.outputs.data_digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          CANDIDATE_VERSION: ${{ needs.publish.outputs.version }}
          CANDIDATE_SOURCE: ${{ github.sha }}
          PUBLICATION_RUN: ${{ github.run_id }}
        run: bash installer/ci/verify_swr_cold_pull.sh
      - name: Retain cold-pull evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swr-cold-pull-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cold-pull-evidence/
          if-no-files-found: error
          retention-days: 14
