name: Publish sample catalog service

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Surfaced so steps can skip SWR when the password secret is empty.
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
      - name: Resolve the image and chart version
        id: version
        run: |
          python -m pip install "PyYAML>=6"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(PYTHONPATH=. python installer/release.py check-tag --tag "${GITHUB_REF_NAME}")"
          else
            stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
            sha="$(git rev-parse --short=7 HEAD)"
            version="$(PYTHONPATH=. python installer/release.py main-build --committed-at "${stamp}" --sha "${sha}")"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "${SWR_PASSWORD}" ]]; then
            echo "swr=true" >> "$GITHUB_OUTPUT"
          else
            echo "swr=false" >> "$GITHUB_OUTPUT"
          fi
          for arch in amd64 arm64; do
            {
              echo "service_${arch}_tags<<EOF"
              echo "ghcr.io/openbkn-ai/bkn-sample-studio:${version}-${arch}"
              if [[ -n "${SWR_PASSWORD}" ]]; then
                echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${version}-${arch}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              {
                echo "data_${arch}_tags<<EOF"
                echo "ghcr.io/openbkn-ai/bkn-samples:${version}-${arch}"
                if [[ -n "${SWR_PASSWORD}" ]]; then
                  echo "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}-${arch}"
                fi
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Write the manifest index for this commit
        # Match the samples actually copied by installer/image/Dockerfile.
        # Other samples are delivered through fixed packages and the catalog.
        run: PYTHONPATH=. python installer/build_manifest_index.py --revision "${GITHUB_SHA}" --output manifest-index.json --samples supply-chain world-cup
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.version.outputs.swr == 'true'
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      # Push each architecture using Docker v2 media types; Basic SWR rejects OCI manifests.
      # Publish Docker manifest lists below after both architecture images are available.
      - name: Build and push the service image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/studio/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.service_amd64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the service image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/studio/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.service_arm64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the sample data image (amd64)
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.data_amd64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Build and push the sample data image (arm64)
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/image/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.version.outputs.data_arm64_tags }}
          outputs: type=image,oci-mediatypes=false,push=true
      - name: Publish Docker manifest lists
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SWR_ENABLED: ${{ steps.version.outputs.swr }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local repository="$1"
            local image="$2"
            local reference="${repository}/${image}:${VERSION}"
            docker manifest create "${reference}" \
              "${repository}/${image}:${VERSION}-amd64" \
              "${repository}/${image}:${VERSION}-arm64"
            docker manifest push "${reference}"
          }

          publish_manifest ghcr.io/openbkn-ai bkn-sample-studio
          if [[ "${SWR_ENABLED}" == "true" ]]; then
            publish_manifest swr.cn-east-3.myhuaweicloud.com/openbkn-ai bkn-sample-studio
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            publish_manifest ghcr.io/openbkn-ai bkn-samples
            if [[ "${SWR_ENABLED}" == "true" ]]; then
              publish_manifest swr.cn-east-3.myhuaweicloud.com/openbkn-ai bkn-samples
            fi
          fi

      - name: Require SWR and GHCR digests to match
        if: steps.version.outputs.swr == 'true'
        run: |
          version="${{ steps.version.outputs.value }}"
          swr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-sample-studio:${version}")"
          ghcr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/openbkn-ai/bkn-sample-studio:${version}")"
          PYTHONPATH=. python installer/release.py check-digests --left "$swr" --right "$ghcr"
      - name: Require sample database SWR and GHCR digests to match
        if: github.ref_type != 'tag' && steps.version.outputs.swr == 'true'
        run: |
          version="${{ steps.version.outputs.value }}"
          swr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "swr.cn-east-3.myhuaweicloud.com/openbkn-ai/bkn-samples:${version}")"
          ghcr="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/openbkn-ai/bkn-samples:${version}")"
          PYTHONPATH=. python installer/release.py check-digests --left "$swr" --right "$ghcr"
      - name: Package the chart for the same version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/bkn-sample-studio/Chart.yaml
          sed -i "s/__VERSION__/${VERSION}/g" deploy/charts/bkn-sample-studio/values.yaml
          helm lint deploy/charts/bkn-sample-studio
          helm package deploy/charts/bkn-sample-studio --destination /tmp/charts
      - name: Push the chart
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/bkn-sample-studio-${{ steps.version.outputs.value }}.tgz" "oci://ghcr.io/openbkn-ai/charts"
