name: sample-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
      - name: Validate sample service Chart
        run: helm lint deploy/charts/bkn-sample-studio
      - name: Install contract validators
        run: python -m pip install "PyYAML>=6" -r tools/publication/requirements.txt
      - name: Validate official publication metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python tools/publication/validate.py . --official
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BASE_SHA^{commit}"
            if git cat-file -e "$BASE_SHA:catalog.json" 2>/dev/null; then
              git show "$BASE_SHA:catalog.json" > /tmp/baseline-catalog.json
              python tools/publication/validate.py . --official --baseline-catalog /tmp/baseline-catalog.json
            fi
          fi
      - name: Validate product catalogs and immutable history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only "$BASE_SHA" -- catalogs | while IFS= read -r previous; do
              case "$previous" in
                catalogs/*/catalog.json) test -f "$previous" || { echo "Product catalog removed: $previous"; exit 1; } ;;
              esac
            done
          fi
          for catalog in catalogs/*/catalog.json; do
            python tools/publication/validate.py . --official --catalog "$catalog"
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
              if git cat-file -e "$BASE_SHA:$catalog" 2>/dev/null; then
                git show "$BASE_SHA:$catalog" > /tmp/baseline-product-catalog.json
                python tools/publication/validate.py . --official --catalog "$catalog" --baseline-catalog /tmp/baseline-product-catalog.json
              fi
            fi
          done
      - name: Validate sample contracts
        run: python -m unittest discover -s installer/tests -v
      - name: Validate bilingual FIBO financial semantics and frozen answers
        run: |
          python tools/financial_fibo/test_financial_fibo.py
          python tools/financial_fibo/test_capabilities.py
          python tools/financial_fibo/test_known_fields.py
          python tools/financial_fibo/test_issuer_known_amount.py
          python tools/financial_fibo/test_observations.py
          python tools/financial_fibo/test_response_contracts.py
      - name: Validate GS1 retail source and recorded acceptance
        run: |
          python tools/retail_source_audit.py
          python tools/retail_gs1/verify.py
          python tools/retail_gs1/test_runtime_adapter.py
          python tools/retail_eval/validate_bank.py
          python tools/retail_eval/replay_recorded.py
      - name: Build and check the manifest index
        run: |
          python installer/build_manifest_index.py --revision "${{ github.sha }}" --output /tmp/manifest-index.json
          python installer/check_manifest_index.py /tmp/manifest-index.json

  supply-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.7
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pci-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database loader dependencies
        run: python -m pip install "PyYAML>=6" "SQLAlchemy>=2" "PyMySQL>=1.1" "psycopg[binary]>=3.1"
      - name: Load and verify the supply sample
        env:
          BKN_SAMPLE_ID: supply-chain
          BKN_SAMPLE_VERSION: "0.1.0"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only
          MYSQL_DATABASE: supply_demo_hand
          MYSQL_ADMIN_DATABASE: mysql
        run: |
          samples/supply_ontology_hand/db/init.sh
          samples/supply_ontology_hand/db/verify.sh
          samples/supply_ontology_hand/db/init.sh
