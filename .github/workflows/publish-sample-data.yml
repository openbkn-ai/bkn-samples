name: Publish sample data

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Sample ID from sample.yaml metadata.name
        type: string
        required: true
      build_context:
        description: Dockerfile COPY paths are relative to this context
        type: choice
        options: [sample, repository]
        default: sample
      version:
        description: Sample version with reviewed release notes
        required: true
        type: string

concurrency:
  group: sample-data-${{ inputs.sample }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SAMPLE: ${{ inputs.sample }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release identity
        id: plan
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          python -m pip install "PyYAML>=6"
          PYTHONPATH=. python tools/publication/plan_data_image.py \
            --sample "$SAMPLE" --version "$VERSION" --context "$BUILD_CONTEXT" \
            --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing image tag
        run: |
          if docker buildx imagetools inspect "ghcr.io/openbkn-ai/bkn-samples:sample-$SAMPLE-v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; use a new version.' >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ steps.plan.outputs.context }}
          file: ${{ steps.plan.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.plan.outputs.tag }}
      - name: Record image digest
        run: echo 'Published digest ${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
