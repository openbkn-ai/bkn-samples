name: Publish sample data

on:
  workflow_dispatch:
    inputs:
      sample:
        type: choice
        options: [order-basics]
        required: true
      version:
        description: Sample version with reviewed release notes
        required: true
        type: string

concurrency:
  group: sample-data-${{ inputs.sample }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SAMPLE: ${{ inputs.sample }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release identity
        run: |
          [[ "$SAMPLE" == "order-basics" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -f "samples/$SAMPLE/releases/$VERSION/release-notes.en-US.md"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing image tag
        run: |
          if docker buildx imagetools inspect "ghcr.io/openbkn-ai/bkn-samples:sample-$SAMPLE-v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; use a new version.' >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: samples/${{ inputs.sample }}
          file: samples/${{ inputs.sample }}/db/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ghcr.io/openbkn-ai/bkn-samples:sample-${{ inputs.sample }}-v${{ inputs.version }}
      - name: Record image digest
        run: echo 'Published digest ${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
