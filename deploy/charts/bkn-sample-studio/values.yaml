replicaCount: 1

# Installation records and catalog cache must survive Pod replacement.
persistence:
  existingClaim: ""
  storageClass: ""
  size: 1Gi

image:
  repository: ghcr.io/openbkn-ai/bkn-sample-studio
  tag: "__VERSION__"
  # The publication workflow stamps the digest of this build for remote installs.
  digest: ""
  pullPolicy: IfNotPresent

dataImage:
  tag: "__VERSION__"
  # Administrator-controlled immutable reference; overrides tag discovery.
  reference: ""

service:
  port: 8080

ingress:
  enabled: true
  ingressClass: class-443
  path: /api/studio

safeURL: http://bkn-safe:3000
# Unified OpenBKN gateway for Vega, knowledge networks and capabilities.
# Used only when internalGateway.enabled=false; never use a Backend-only service.
baseURL: ""
# Pod-local proxy for sample API calls. It has no Service or Ingress.
# Disable only when baseURL supplies a reachable, trusted unified gateway.
internalGateway:
  enabled: true
  image:
    repository: docker.io/library/nginx
    tag: 1.28-alpine
    digest: sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    pullPolicy: IfNotPresent
  # Administrator-controlled service addresses; tpl expands the release namespace.
  upstreams:
    backend: "http://bkn-backend-svc.{{ .Release.Namespace }}.svc.cluster.local:13014"
    vega: "http://vega-backend-svc.{{ .Release.Namespace }}.svc.cluster.local:13014"
    capabilities: "http://agent-operator-integration.{{ .Release.Namespace }}.svc.cluster.local:9000"
    query: "http://ontology-query-svc.{{ .Release.Namespace }}.svc.cluster.local:13018"
    retrieval: "http://agent-retrieval.{{ .Release.Namespace }}.svc.cluster.local:30779"
    modelManager: "http://mf-model-manager.{{ .Release.Namespace }}.svc.cluster.local:9898"
    modelAPI: "http://mf-model-api.{{ .Release.Namespace }}.svc.cluster.local:9898"
    observability: "http://agent-observability.{{ .Release.Namespace }}.svc.cluster.local:8080"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Optional direct Backend address for public version detection only.
# Empty uses baseURL. It does not change CLI, hook or uninstall routing.
backendURL: ""
# Optional acceptance-only pin to an official raw catalog at a full commit SHA.
# Empty uses the official main branch pointer.
catalogURL: ""

# Optional legacy/operator overrides. Empty version reads the backend health API;
# empty capabilities uses this installer's supported standard API adapters.
# This does not declare target API availability or licensed platform features.
platform:
  version: ""
  capabilities: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
