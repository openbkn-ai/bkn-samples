replicaCount: 1

# Installation records and catalog cache must survive Pod replacement.
persistence:
  existingClaim: ""
  storageClass: ""
  size: 1Gi

image:
  registry: ghcr.io/openbkn-ai
  repository: bkn-sample-studio
  tag: "__VERSION__"
  pullPolicy: IfNotPresent

dataImage:
  tag: "__VERSION__"
  # Administrator-controlled immutable reference; overrides tag discovery.
  reference: ""

service:
  port: 8080

ingress:
  enabled: true
  ingressClass: class-443
  path: /api/studio

safeURL: http://bkn-safe:3000
# Unified OpenBKN gateway for Vega, knowledge networks and capabilities.
# Reuse the product ingress-nginx HTTP entrypoint, independently of public TLS.
# Operators may override it for a different internal topology.
baseURL: "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local"
# Optional direct Backend address for public version detection only.
# Empty uses baseURL. It does not change CLI, hook or uninstall routing.
backendURL: ""
# Optional acceptance-only pin to an official raw catalog at a full commit SHA.
# Empty uses the official main branch pointer.
catalogURL: ""

# Optional legacy/operator overrides. Empty version reads the backend health API;
# empty capabilities uses this installer's supported standard API adapters.
# This does not declare target API availability or licensed platform features.
platform:
  version: ""
  capabilities: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
