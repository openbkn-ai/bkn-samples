{{- if .Values.internalGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bkn-sample-studio-gateway
  namespace: {{ .Release.Namespace }}
data:
  default.conf.template: |
    # Fixed route targets; no upstream address comes from a client request.
    map $uri $sample_upstream {
      default "";
      ~^/api/bkn-backend/ {{ tpl .Values.internalGateway.upstreams.backend . }};
      ~^/api/ontology-manager/ {{ tpl .Values.internalGateway.upstreams.backend . }};
      ~^/api/vega-backend/ {{ tpl .Values.internalGateway.upstreams.vega . }};
      ~^/api/agent-operator-integration/ {{ tpl .Values.internalGateway.upstreams.capabilities . }};
      ~^/api/ontology-query/ {{ tpl .Values.internalGateway.upstreams.query . }};
      ~^/api/agent-retrieval/ {{ tpl .Values.internalGateway.upstreams.retrieval . }};
      ~^/api/mf-model-manager/ {{ tpl .Values.internalGateway.upstreams.modelManager . }};
      ~^/api/mf-model-api/ {{ tpl .Values.internalGateway.upstreams.modelAPI . }};
      ~^/api/agent-observability/ {{ tpl .Values.internalGateway.upstreams.observability . }};
    }
    server {
      listen 127.0.0.1:8082;
      server_name localhost;
      # Read the Pod's DNS configuration through the official image entrypoint.
      # Resolve on demand so an optional upstream need not exist at startup.
      resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
      client_max_body_size 512m;
      access_log off;
      location = /healthz { return 200 "ok\n"; }
      location / {
        if ($sample_upstream = "") { return 404; }
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass $sample_upstream$request_uri;
      }
    }
{{- end }}
