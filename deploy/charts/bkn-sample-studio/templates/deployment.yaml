{{- if ne (toString .Values.replicaCount) "1" }}
{{- fail "bkn-sample-studio currently requires replicaCount=1; installation locks are process-local" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bkn-sample-studio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bkn-sample-studio
  template:
    metadata:
      labels:
        app: bkn-sample-studio
    spec:
      serviceAccountName: bkn-sample-studio
      automountServiceAccountToken: false
      containers:
        - name: studio
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: BKN_SAMPLE_DB_HOST
              value: bkn-sample-database.{{ .Release.Namespace }}.svc.cluster.local
            - name: BKN_SAMPLE_DB_REGISTRY
              value: {{ .Values.sampleDatabase.registryDatabase | quote }}
            - name: BKN_SAMPLE_DB_PASSWORD_FILE
              value: /var/run/bkn-sample-database/mariadb-root-password
            - name: BKN_SAFE_URL
              value: {{ .Values.safeURL | quote }}
            - name: BKN_BASE_URL
              value: {{ .Values.baseURL | quote }}
            - name: BKN_BACKEND_URL
              value: {{ .Values.backendURL | default "" | quote }}
            - name: BKN_SAMPLE_CATALOG_URL
              value: {{ .Values.catalogURL | quote }}
            - name: BKN_SAMPLE_STATE_DIR
              value: /var/lib/bkn-samples/state
            - name: BKN_SAMPLE_IMAGE_INDEX
              value: /opt/bkn-samples/manifest-index.json
            - name: BKN_SAMPLE_DATA_IMAGE_TAG
              value: {{ .Values.dataImage.tag | quote }}
            - name: BKN_SAMPLE_DATA_IMAGE_REF
              value: {{ .Values.dataImage.reference | quote }}
            - name: BKN_SAMPLE_PLATFORM_VERSION
              value: {{ .Values.platform.version | quote }}
            - name: BKN_SAMPLE_PLATFORM_CAPABILITIES
              value: {{ join "," .Values.platform.capabilities | quote }}
            - name: BKN_SAMPLE_EXECUTOR_IMAGE_REF
              value: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: database-credentials
              mountPath: /var/run/bkn-sample-database
              readOnly: true
            - name: state
              mountPath: /var/lib/bkn-samples
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: database-credentials
          secret:
            secretName: {{ default "bkn-sample-database" .Values.sampleDatabase.existingSecret | quote }}
            defaultMode: 0400
        - name: state
          persistentVolumeClaim:
            claimName: {{ default "bkn-sample-studio-state" .Values.persistence.existingClaim | quote }}
