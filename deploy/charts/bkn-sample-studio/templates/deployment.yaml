{{- if ne (toString .Values.replicaCount) "1" }}
{{- fail "bkn-sample-studio currently requires replicaCount=1; installation locks are process-local" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bkn-sample-studio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bkn-sample-studio
  template:
    metadata:
      labels:
        app: bkn-sample-studio
      {{- if .Values.internalGateway.enabled }}
      annotations:
        checksum/internal-gateway: {{ include (print $.Template.BasePath "/internal-gateway.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: bkn-sample-studio
      containers:
        - name: studio
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: BKN_SAFE_URL
              value: {{ .Values.safeURL | quote }}
            - name: BKN_BASE_URL
              value: {{ if .Values.internalGateway.enabled }}"http://127.0.0.1:8082"{{ else }}{{ required "baseURL must supply a unified gateway when internalGateway is disabled" .Values.baseURL | quote }}{{ end }}
            - name: BKN_BACKEND_URL
              value: {{ .Values.backendURL | default "" | quote }}
            - name: BKN_SAMPLE_CATALOG_URL
              value: {{ .Values.catalogURL | quote }}
            - name: BKN_SAMPLE_STATE_DIR
              value: /var/lib/bkn-samples/state
            - name: BKN_SAMPLE_IMAGE_INDEX
              value: /opt/bkn-samples/manifest-index.json
            - name: BKN_SAMPLE_DATA_IMAGE_TAG
              value: {{ .Values.dataImage.tag | quote }}
            - name: BKN_SAMPLE_DATA_IMAGE_REF
              value: {{ .Values.dataImage.reference | quote }}
            - name: BKN_SAMPLE_PLATFORM_VERSION
              value: {{ .Values.platform.version | quote }}
            - name: BKN_SAMPLE_PLATFORM_CAPABILITIES
              value: {{ join "," .Values.platform.capabilities | quote }}
            - name: BKN_SAMPLE_EXECUTOR_IMAGE_REF
              value: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/bkn-samples
        {{- if .Values.internalGateway.enabled }}
        - name: internal-gateway
          image: "{{ .Values.internalGateway.image.repository }}{{ if .Values.internalGateway.image.digest }}@{{ .Values.internalGateway.image.digest }}{{ else }}:{{ .Values.internalGateway.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.internalGateway.image.pullPolicy }}
          env:
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: NGINX_ENVSUBST_FILTER
              value: "^NGINX_LOCAL_RESOLVERS$"
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
          resources:
            {{- toYaml .Values.internalGateway.resources | nindent 12 }}
          volumeMounts:
            - name: internal-gateway
              mountPath: /etc/nginx/templates
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.internalGateway.enabled }}
        - name: internal-gateway
          configMap:
            name: bkn-sample-studio-gateway
        {{- end }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ default "bkn-sample-studio-state" .Values.persistence.existingClaim | quote }}
