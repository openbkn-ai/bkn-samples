apiVersion: v1
kind: Secret
metadata:
  name: bkn-sample-${BKN_SAMPLE_ID}
  namespace: ${BKN_NAMESPACE}
type: Opaque
stringData:
  database-password: ${BKN_DATABASE_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: bkn-sample-${BKN_SAMPLE_ID}
  namespace: ${BKN_NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: bkn-sample
    app.kubernetes.io/instance: ${BKN_SAMPLE_ID}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bkn-sample-${BKN_SAMPLE_ID}
  namespace: ${BKN_NAMESPACE}
spec:
  serviceName: bkn-sample-${BKN_SAMPLE_ID}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bkn-sample
      app.kubernetes.io/instance: ${BKN_SAMPLE_ID}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bkn-sample
        app.kubernetes.io/instance: ${BKN_SAMPLE_ID}
    spec:
      containers:
        - name: database
          image: ${BKN_SAMPLES_IMAGE}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: BKN_SAMPLE_ID
              value: ${BKN_SAMPLE_ID}
            - name: BKN_SAMPLE_VERSION
              value: ${BKN_SAMPLE_VERSION}
            - name: BKN_DATA_VERSION
              value: ${BKN_DATA_VERSION}
            - name: BKN_DATABASE
              value: ${BKN_DATABASE}
            - name: MARIADB_DATABASE
              value: ${BKN_DATABASE}
            - name: MARIADB_USER
              value: bkn_sample
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bkn-sample-${BKN_SAMPLE_ID}
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bkn-sample-${BKN_SAMPLE_ID}
                  key: database-password
            - name: BKN_INIT_ATTEMPT
              value: ${BKN_INIT_ATTEMPT}
          readinessProbe:
            exec:
              command: ["/opt/bkn-samples/bin/healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: sample-data
              mountPath: /var/lib/bkn-samples
  volumeClaimTemplates:
    - metadata:
        name: sample-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
